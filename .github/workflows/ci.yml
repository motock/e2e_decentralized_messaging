name: CI

on:
  push:
    branches: [main]
    # Tag pushes (v*) trigger the release job, which attaches the prebuilt
    # web client dist to a GitHub Release so consumers can run it without
    # building from source.
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      # TEMPORARY DIAGNOSTIC -- REMOVE BEFORE MERGE.
      # The desktop lib unit-test binary (clients_desktop_tauri-*.exe) fails to
      # load on Windows with 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND once
      # core_storage's vendored SQLCipher/OpenSSL is linked into it. `dumpbin
      # /DEPENDENTS` already showed that exe imports ONLY system DLLs -- no
      # libssl/libcrypto/sqlite -- so no third-party DLL is missing and the
      # unresolved symbol must be a FUNCTION inside a system DLL. This step
      # resolves every imported function with the loader's own GetProcAddress
      # and reports the ones that do not resolve, with `cargo test -p storage
      # --lib` as a control (that target links the same static SQLCipher and
      # passes on this runner today).
      - name: Resolve desktop lib test binary imports (windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test -p clients-desktop-tauri --lib --locked --no-run 2>&1 | Select-Object -Last 3
          $exe = Get-ChildItem target/debug/deps/clients_desktop_tauri-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "DIAG: no clients_desktop_tauri test exe found"; exit 0 }
          Write-Host "DIAG exe: $($exe.FullName)"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "DIAG: dumpbin not found"; exit 0 }

          $raw = & $dumpbin.FullName /IMPORTS $exe.FullName 2>&1
          $raw | Set-Content -Path imports.txt

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Ldr {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi)]
            public static extern IntPtr LoadLibraryA(string name);
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi)]
            public static extern IntPtr GetProcAddress(IntPtr h, string name);
          }
          "@

          $cur = $null; $h = [IntPtr]::Zero; $missing = @(); $checked = 0; $dlls = 0
          foreach ($line in $raw) {
            if ($line -match '^\s+(\S+\.dll)\s*$') {
              $cur = $Matches[1]; $dlls++
              $h = [Ldr]::LoadLibraryA($cur)
              if ($h -eq [IntPtr]::Zero) { Write-Host "DIAG: could not load $cur from the default search order" }
              continue
            }
            if (-not $cur) { continue }
            if ($line -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
              $fn = $Matches[1]
              $checked++
              if ($h -eq [IntPtr]::Zero) { $missing += "${cur}!${fn} (DLL not loadable)"; continue }
              if ([Ldr]::GetProcAddress($h, $fn) -eq [IntPtr]::Zero) { $missing += "${cur}!${fn}" }
            }
          }
          Write-Host "DIAG: $dlls DLLs, $checked imported functions resolved"
          if ($missing.Count -eq 0) {
            Write-Host "DIAG: EVERY import resolves -- the missing entrypoint is NOT in this exe's import table"
          } else {
            Write-Host "DIAG: $($missing.Count) UNRESOLVED:"
            $missing | ForEach-Object { Write-Host "DIAG MISSING: $_" }
          }

          Write-Host "===== DIAG: run the exe directly and read the event log ====="
          & $exe.FullName --list 2>&1 | Select-Object -First 5
          Write-Host "DIAG exe-exit=$LASTEXITCODE"
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'clients_desktop_tauri|bcryptprimitives|entry point|SideBySide' } |
            ForEach-Object { Write-Host "DIAG EVENT: $($_.Message -replace '\s+',' ')" }

          Write-Host "===== DIAG control: storage lib tests (same static SQLCipher+OpenSSL) ====="
          cargo test -p storage --lib --locked 2>&1 | Select-Object -Last 8
          Write-Host "DIAG storage-exit=$LASTEXITCODE"
      - run: cargo test --workspace --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check (excludes tests/ fixtures, which are protected acceptance oracles)
        run: |
          find . -name '*.rs' -not -path './target/*' -not -path '*/tests/*' \
            -not -path './docs/audit/findings.rs' \
            -print0 | xargs -0 rustfmt --check --edition 2021
      - name: cargo clippy (excludes integration tests/, which are protected acceptance oracles)
        run: cargo clippy --workspace --lib --bins --examples --all-features --locked -- -D warnings

  wasm-target:
    name: wasm32 target build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wasm-bindings --target wasm32-unknown-unknown --locked

  web-client:
    name: web client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - name: npm audit high/critical
        run: |
          npm audit --audit-level=high --production
      # relay_integration.test.ts spawns `cargo run --bin relay_ws_test_harness`
      # and lets it take 60s to print its ws:// URL. Compile that binary here so
      # the budget measures startup rather than a cold build of the relay tree.
      - name: Prebuild the relay test harness
        working-directory: ${{ github.workspace }}
        run: cargo build --bin relay_ws_test_harness
      - run: npm test

  web-artifact:
    name: web client build artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      # `npm run build` chains prepare-wasm (wasm-pack build) -> vite build,
      # producing a self-contained static bundle in clients/web/dist
      # (index.html + JS + CSS + the .wasm binary + fonts). No relay URL is
      # baked in: VITE_RELAY_WS_URL is left unset so consumers point the
      # artifact at any relay via localStorage["relayWsUrl"] at runtime.
      - run: npm run build
      - name: Upload web client dist
        uses: actions/upload-artifact@v4
        with:
          name: web-client-dist
          path: clients/web/dist
          if-no-files-found: error

  release:
    name: release web client artifact
    # Only on version tags (v*). The push trigger above includes tags: ['v*'].
    if: startsWith(github.ref, 'refs/tags/')
    needs: web-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: web-client-dist
          path: web-client-dist
      - name: Zip dist
        run: zip -r web-client-dist.zip web-client-dist
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: web-client-dist.zip
