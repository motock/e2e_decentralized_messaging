[package]
name = "clients-desktop-tauri"
version.workspace = true
edition.workspace = true
description = "Tauri desktop shell — thin UI over the shared Rust core (PLAN.md Phase 5)"
build = "build.rs"

[lib]
name = "clients_desktop_tauri"
path = "src-tauri/src/lib.rs"

[[bin]]
name = "desktop-tauri"
path = "src-tauri/src/main.rs"

[dependencies]
# Path deps into the shared core, aliased to the names PLAN.md's Phase 5 story calls them by
# (`core_crypto`/`core_protocol`/`core_transport`). The underlying crates are still named
# `crypto`/`protocol`/`transport` (see their own Cargo.toml `[package] name`) — aliasing here is
# how a downstream crate names its dependency, not a rename of the real crates, so it doesn't
# touch any already-merged code or tests in `core/*`.
core_crypto = { package = "crypto", path = "../../core/crypto" }
core_protocol = { package = "protocol", path = "../../core/protocol" }
core_transport = { package = "transport", path = "../../core/transport" }
core_storage = { package = "storage", path = "../../core/storage" }

# DT-2: native WebSocket client for the relay's WS wire protocol (mirrors
# clients/web/src/relay_transport.ts). Versions match the entries already locked in
# Cargo.lock (tokio-tungstenite 0.29.0, base64 0.22.1, sha2 0.10.9, futures-util
# 0.3.32) so no second copy is pulled in. sha2 is needed to solve the relay's PoW
# challenge locally (relay/src/pow); tokio(time) bounds each response read and
# tokio(rt) runs the PoW solve off the async executor via spawn_blocking.
# DT-3: rustls (webpki roots) so a wss:// relay can connect without a
# platform TLS/linker dependency (native-tls would reintroduce the kind of
# platform-specific link problem this crate already hit on Windows). The
# `ring` provider is used (not aws-lc-sys) so no cmake/NASM C toolchain is
# needed on windows-latest.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DT-3: parse relay URLs with the `url` crate so host checks compare the
# parsed Host (never string prefixes) — see src-tauri/src/relay_config.rs.
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
# Real in-process relay + a scripted fake relay for tests/relay_client.rs.
relay = { path = "../../relay" }
tokio-tungstenite = "0.29"
futures = "0.3"
# tests/relay_client_rework.rs builds challenge wire frames directly.
base64 = "0.22"
